<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цех схемаси</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#ffffff;--ink:#1f1f1d;--mut:#6b6a64;--line:#d3d1c7;--btn:#0F6E56;--btnt:#fff}
:root.dark{--bg:#18181b;--ink:#ecebe6;--mut:#a6a59e;--line:#3a3935;--btn:#5DCAA5;--btnt:#04342C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:12px 12px 20px}
h1{font-size:18px;margin:0 0 2px;font-weight:600}
.sub{color:var(--ink);font-size:14px;font-weight:600;margin-bottom:8px}
.hint{font-size:13px;color:var(--mut);margin:6px 0 10px}
svg{width:100%;height:auto;display:block;user-select:none}
.m{cursor:pointer}
.m:active rect{opacity:.65}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin:10px 0 14px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px;background:var(--btn);color:var(--btnt);cursor:pointer}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
#toast a{color:inherit;font-weight:700}
.err{padding:12px;border:1px solid var(--line);border-radius:10px;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<h1>Цех схемаси</h1>
<div class="sub" id="sub">Ҳолат юкланмоқда…</div>
<div class="hint">Ускунанинг устига босинг — шу ускуна бўйича маълумот киритиш очилади.</div>
<div id="map"></div>
<div id="toast" style="display:none;margin:10px 0;padding:10px 12px;border-radius:10px;background:var(--btn);color:var(--btnt);font-size:14px"></div>
<div class="legend" id="legend"></div>
<div class="btns">
<button class="sec" id="wh">📦 Омборга кирим</button>
<button class="sec" id="rep">📊 Ҳисобот</button>
</div>
</div>
<script>
const MACHINES = [{"n":1,"name":"Kim Press 26A","type":"press","sheet":1,"x":47,"y":57,"w":164,"h":68},{"n":2,"name":"Kim Press 26B","type":"press","sheet":2,"x":372,"y":17,"w":248,"h":70},{"n":3,"name":"Kim Press 26C","type":"press","sheet":2,"x":417,"y":150,"w":198,"h":110},{"n":4,"name":"Ammy Press 21","type":"press","sheet":1,"x":45,"y":160,"w":165,"h":65},{"n":5,"name":"Ammy Press 23","type":"press","sheet":1,"x":102,"y":367,"w":223,"h":75},{"n":6,"name":"Ammy Press 24","type":"press","sheet":1,"x":527,"y":372,"w":110,"h":63},{"n":7,"name":"Kim Cup 25","type":"cup","sheet":2,"x":418,"y":395,"w":153,"h":65},{"n":8,"name":"Kim Cup 26A","type":"cup","sheet":1,"x":460,"y":95,"w":112,"h":55},{"n":9,"name":"Kim Cup 26B","type":"cup","sheet":1,"x":460,"y":205,"w":117,"h":58},{"n":10,"name":"Kim Cup 26C","type":"cup","sheet":1,"x":590,"y":92,"w":58,"h":168},{"n":11,"name":"Kim Cup 26D","type":"cup","sheet":2,"x":338,"y":215,"w":64,"h":205},{"n":12,"name":"Ammy Cup 21","type":"cup","sheet":1,"x":31,"y":262,"w":169,"h":63},{"n":13,"name":"Ammy Cup 23","type":"cup","sheet":1,"x":265,"y":42,"w":72,"h":173},{"n":14,"name":"Ammy Cup 24A","type":"cup","sheet":1,"x":402,"y":372,"w":105,"h":58},{"n":15,"name":"Ammy Cup 24B","type":"cup","sheet":1,"x":370,"y":47,"w":72,"h":163},{"n":16,"name":"Lin Bottle 25","type":"bottle","sheet":2,"x":581,"y":307,"w":64,"h":153},{"n":17,"name":"Negri Bossi 220","type":"other","sheet":2,"x":165,"y":215,"w":75,"h":228},{"n":18,"name":"Negri Bossi 450","type":"other","sheet":2,"x":252,"y":222,"w":72,"h":210},{"n":19,"name":"Walmo 350","type":"other","sheet":2,"x":77,"y":210,"w":73,"h":243}];
const PRODUCTS = {"rlmd":"F15 Экспорт","hfc1":"F8 Экспорт","veqg":"Ру-1","ebx6":"F8","xwyo":"F8 40 М","xuim":"F15","3d2y":"Текис копкок","g3ea":"Сметана 365 мини","81od":"К-300 Экспорт","ftqy":"К-500 Экспорт","l4a3":"К-700 Экспорт","8z84":"К-700","09a0":"К-500","e0q3":"К-300","6v2r":"К-1000 Экспорт","3kby":"Десерт 250 Гумбаз К","g2j6":"Каймок 250","8lit":"Курт 150","n43j":"Десерт 150 Гумбаз К","rnb6":"Каймок 500","oo99":"Курт 150 ок","sqmm":"Каймок 250 ок","o4fc":"Каймок 0,25","7ica":"Каймок 400","akzy":"Каймок 500 ок","wcs1":"Каймок 0,4","04ef":"Курт 150 теги","9m0w":"Десерт 250 теги","oi33":"Курт 150 ок теги","7isg":"Каймок 365 мини","qc4r":"Каймок 0,4 теги","rwp5":"Десерт 150 теги","ozui":"Каймок 365 макси","ymkk":"Гумбаз Копкок Тешикли","w6o1":"Гумбаз Копкок Тешиксиз","deqt":"Коса реб","tctg":"Челак 1л","l6dg":"Коса 600","4d6s":"Челак ок 1л","xlhy":"Тогорача 3 л","muyl":"Тогорача 2 л","rh1i":"Соус 80гр","gs1g":"катик челак 365","lbay":"Тогорача 3 л кора","gtj8":"Коса 600 кора","pa4v":"Чаша Bowl 150 ок","oyau":"Челак Кулупнай","ruv2":"Чаша Bowl 350 ок","0iz3":"катик челак музкаймок","59j3":"тогорача теги 2 л","d1hp":"Коса теги","uvu0":"тогорача теги 3 л","9iuy":"Челак Малина","l16j":"Коса кора","xeg6":"Челак Мазза","cxaw":"Челак Олео","n3f6":"Челак Чикс","s7xd":"Челак Банан","t5l2":"Челак Смородина","n4lp":"Челак Олма","k1r9":"Челак Шафтоли","dfcq":"Челак Какао","juqv":"Челак Фозилов Банан","73dw":"Челак Фозилов Кулупнай","ccwr":"Коса ок","98tm":"Коса крышка","epni":"Коса 600 теги","ayst":"Челак Классика","rwa8":"Челак Сгущенка","plv2":"Челак Боветти","w1dw":"Челак Ламусса","w7th":"Тогорача 2 л кора","6w1m":"Челак Шина гел","03b9":"Челак СССР","fe90":"Челак Клубника","trir":"Челак Фозилов шоколад","6i70":"Соус 80 гр теги","cl0e":"Челак Катик","qce6":"Челак Фозилов Киви","k3dw":"Тогорача теги 3 л кора","tgg3":"Коса 600 копкок","n2jt":"Чаша Bowl 150 яшил","xcwj":"Чаша Bowl 150 пушти","ddvc":"Чаша Bowl 350 Яшил","sf76":"Чаша Bowl 350 пушти","ih7u":"Челак кизил 1л","cpbu":"Челак Яшил 1л","xtox":"Мева 250","ol8l":"Мева 500","d207":"Мева 1000","x1j3":"Ов-425","5whb":"Ов-300","i8h7":"Ов-600 300м","mxpj":"Ов-600 Экспорт","2e0d":"Ов-600 350м","qqq9":"Ов-600 400м","fkfr":"Ов-425 300 M","f83r":"П- 700 ок","7xev":"П- 1000 ок (1400)","js0f":"П- 500 ок","o3on":"П- 700 кора","2n9z":"П- 1000","32wv":"П- 500 кора (1600)","x80e":"П- 500","z8nc":"П- 1000 кора 1400","lsuo":"П- 1000 кора 1000","14pd":"П- 700 ШАФАФ","wowt":"ПЕТ бутылка 0,9 л ок","zuox":"ПЕТ бутылка 0,9 л","3cql":"ПЕТ бутылка 0,25 л","cku2":"ПЕТ бутылка 0,31 л","e9mt":"ПЕТ бутылка 0,29 л ок","n8tl":"ПЕТ бутылка 0,29 л","xc16":"ПЕТ бутылка 0,9 л 20 грамм","uccy":"ПЕТ бутылка 0,31 л ок","smvl":"ПЕТ бутылка 0,25 л ок","0zik":"Рама","hrkl":"Рама КК - 900 ок","cp1g":"С-1","jwvv":"Стакан 500 Гумбаз К","p95q":"Стакан 400 Гумбаз К","snav":"С-1 Экспорт","eupd":"Стакан 700 Гумбаз К","rnir":"Стакан 300","volv":"С-2 Тулкин Экспорт","yflc":"С-1 ок","q7v4":"ICE Coffee 500","s4fm":"ICE Coffee копкок","nt93":"Стакан 500 теги","rnkf":"ICE Coffee 400","6icw":"Стакан 400 теги","j5or":"Стакан 700","cco6":"ICE Coffee 700","9hlz":"С-1 Идишчи","1s1y":"С-1 ДК","8aeo":"С-2 Тулкин","axql":"Стакан 300 Гумбаз К","nydj":"Стакан 700 Текис К","i06g":"С-1 кизил","33t2":"Стакан 400 Текис К","r8vb":"Ребристые тарелки ок","974b":"Ребристые тарелки Пушти","jjrt":"Ребристые тарелки Яшил","e3fs":"Тарелки Чарх ок","pr6i":"Тарелки Чарх яшил","4uya":"Тарелки Чарх пушти","pwbb":"Тухум 10А","693v":"Тухум 15А","m90v":"Бедана 20","4k1h":"Бедана 12","kpd1":"Тухум 6","s0ms":"Тухум 30 (латок+копкок)","zr4g":"Тухум 30 кора (латок+копкок)","h84d":"УПЗ - 650","y7dx":"УПЗ-250/250","t5xx":"УПЗ-500","4qcb":"УПЗ- копкок","u84k":"УПЗ-300/150","7ctf":"УПЗ - 350/80","bovt":"УПЗ Юмалок 350","22x8":"УПЗ Юмалок 250","uh1r":"УПЗ 109/45","8kn1":"П- 500 кора (2000)","ydoq":"П- 1000 ок (1000)","u1dq":"П- 700 ок 1000 талик","jrbr":"Тогорача копкок"};
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const dark = tg ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
if (dark) document.documentElement.classList.add('dark');
const qs = new URLSearchParams(location.search);
// Саҳифага ёзилган бот номи биринчи ўринда; манзилдаги ?bot= фақат у бўлмаса ишлатилади (ортиқча белгилар тозаланади)
const cleanBot = (v) => { let s = String(v || '').trim(); const i = s.lastIndexOf('t.me/'); if (i >= 0) s = s.slice(i + 5); s = s.replace(/^@/, '').split('/')[0].split('?')[0].split('#')[0].split(' ')[0]; return s.replace(/[^A-Za-z0-9_]/g, ''); };
const BOT = cleanBot("Atlantzavod_bot") || cleanBot(qs.get('bot'));
const START = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || qs.get('tgWebAppStartParam') || qs.get('s') || '';

const PAL = dark ? {
  run:{f:'#04342C',s:'#5DCAA5',t:'#E1F5EE'}, empty:{f:'#2C2C2A',s:'#888780',t:'#D3D1C7'}, stop:{f:'#501313',s:'#F09595',t:'#FCEBEB'}
} : {
  run:{f:'#E1F5EE',s:'#0F6E56',t:'#04342C'}, empty:{f:'#F1EFE8',s:'#888780',t:'#5F5E5A'}, stop:{f:'#FCEBEB',s:'#A32D2D',t:'#501313'}
};

// Ҳолатни ўқиш
const state = {};
let sub = 'Ҳолат маълум эмас — каналдаги охирги «Схемани очиш» тугмаси орқали очинг.';
if (/^[dn]\d{10}/.test(START)) {
  const k = START[0], d = START.slice(1, 7), hm = START.slice(7, 11);
  sub = d.slice(4, 6) + '.' + d.slice(2, 4) + '.20' + d.slice(0, 2) + ' · ' + (k === 'd' ? 'кундузги навбат (08:00–20:00)' : 'тунги навбат (20:00–08:00)') + ' · 🕒 ' + hm.slice(0, 2) + ':' + hm.slice(2) + ' ҳолати';
  const body = START.slice(11);
  MACHINES.forEach((m, i) => {
    const c = body.slice(i * 5, i * 5 + 5);
    if (c.length < 5) return;
    const code = c.slice(1);
    const name = code !== '0000' ? (PRODUCTS[code] || 'идиш') : '';
    state[m.n] = { status: c[0] === 'm' ? 'r' : c[0], product: c[0] === 'c' ? 'бошқа идиш' : c[0] === 'm' ? (name || 'идиш') + ' + яна' : name };
  });
}
document.getElementById('sub').textContent = sub;

function wrap(text, max) {
  const words = String(text || '').split(/\s+/).filter(Boolean), lines = [];
  let cur = '';
  for (let w of words) {
    while (w.length > max) { if (cur) { lines.push(cur); cur = ''; } lines.push(w.slice(0, max)); w = w.slice(max); }
    if (!cur) cur = w; else if ((cur + ' ' + w).length <= max) cur += ' ' + w; else { lines.push(cur); cur = w; }
  }
  if (cur) lines.push(cur);
  return lines;
}
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

const T1 = 30, T2 = 540, W = 680, H = 1040;
let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Цех схемаси">';
[[T1, '1-қисм'], [T2, '2-қисм']].forEach(([top, label]) => {
  svg += '<rect x="10" y="' + top + '" width="660" height="490" rx="12" fill="none" stroke="' + (dark ? '#3a3935' : '#B4B2A9') + '" stroke-dasharray="5 4"/>';
  svg += '<text x="20" y="' + (top + 16) + '" font-size="11" fill="' + (dark ? '#888780' : '#888780') + '">' + label + '</text>';
});
for (const m of MACHINES) {
  const st = state[m.n] || {};
  const kind = st.status === 's' ? 'stop' : st.status === 'r' || st.status === 'c' ? 'run' : 'empty';
  const c = PAL[kind];
  const top = (m.sheet === 1 ? T1 : T2) + m.y;
  const cpl = (fs) => Math.max(4, Math.floor((m.w - 8) / (fs * 0.55)));
  let lines = [{ t: '№' + m.n, fs: 24, b: 1 }];
  const nameL = wrap(m.name, cpl(12)).map((t) => ({ t, fs: 12, mu: 1 }));
  const prodL = st.status === 's' ? [{ t: 'ТЎХТАГАН', fs: 15, b: 1 }] : st.product ? wrap(st.product, cpl(15)).map((t) => ({ t, fs: 15, b: 1 })) : [{ t: 'бўш', fs: 15, mu: 1 }];
  const sum = (a) => a.reduce((x, l) => x + l.fs * 1.22, 0);
  let all = lines.concat(nameL, prodL);
  if (sum(all) > m.h - 6) all = lines.concat(prodL);
  while (sum(all) > m.h - 6 && all.length > 2) { all.pop(); const l = all[all.length - 1]; l.t = l.t.slice(0, Math.max(1, l.t.length - 1)) + '…'; }
  let y = top + (m.h - sum(all)) / 2;
  svg += '<g class="m" data-n="' + m.n + '"><rect x="' + m.x + '" y="' + top + '" width="' + m.w + '" height="' + m.h + '" rx="6" fill="' + c.f + '" stroke="' + c.s + '" stroke-width="' + (kind === 'stop' ? 2.5 : 1.2) + '"/>';
  for (const l of all) { y += l.fs * 1.22; svg += '<text x="' + (m.x + m.w / 2) + '" y="' + (y - l.fs * 0.28).toFixed(1) + '" font-size="' + l.fs + '" text-anchor="middle" font-weight="' + (l.b ? 700 : 400) + '" fill="' + (l.mu ? c.s : c.t) + '" pointer-events="none">' + esc(l.t) + '</text>'; }
  svg += '</g>';
}
svg += '</svg>';
document.getElementById('map').innerHTML = svg;

const LEG = [['run', 'Ишлаяпти'], ['empty', 'Бўш'], ['stop', 'Тўхтаган']];
document.getElementById('legend').innerHTML = LEG.map(([k, t]) => '<span><i style="background:' + PAL[k].f + ';border-color:' + PAL[k].s + '"></i>' + t + '</span>').join('');

function say(msg) { try { tg && tg.showAlert ? tg.showAlert(msg) : alert(msg); } catch (e) { alert(msg); } }
function go(arg) {
  if (!BOT) { say('Созлашда хато: бот номи кўрсатилмаган. sxema-yasash.mjs ни бот номи билан ишга туширинг.'); return; }
  const url = 'https://t.me/' + BOT + '?start=' + arg;
  try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); } catch (e) {}
  // Ботга ўтамиз ва Mini App'ни ёпамиз — акс ҳолда бот ойнаси орқада очилиб, кўринмай қолади
  const box = document.getElementById('toast');
  box.innerHTML = 'Ботга ўтилмоқда… Очилмаса, <a href="' + url + '">шу ерни босинг</a>.';
  box.style.display = 'block';
  if (tg && tg.openTelegramLink) {
    try { tg.openTelegramLink(url); } catch (e) { location.href = url; }
    setTimeout(() => { try { tg.close(); } catch (e) {} }, 400);
  } else location.href = url;
}
document.getElementById('map').addEventListener('click', (e) => {
  const g = e.target.closest('.m');
  if (g) go('m' + g.dataset.n);
});
document.getElementById('wh').onclick = () => go('wh');
document.getElementById('rep').onclick = () => go('rep');
</script>
</body>
</html>
